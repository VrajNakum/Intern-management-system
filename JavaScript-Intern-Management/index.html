<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Training & Performance Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- Header Navigation -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-600 rounded-lg text-white">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <h1 class="text-lg font-bold text-white tracking-wide">InternTrack <span class="text-xs text-indigo-400 font-normal">Pro</span></h1>
            </div>
            <nav class="hidden md:flex space-x-1" id="mainNav">
                <a href="index.html" class="nav-item active"><i class="fa-solid fa-chart-pie mr-2"></i>Dashboard</a>
                <a href="interns.html" class="nav-item"><i class="fa-solid fa-users mr-2"></i>Interns</a>
                <a href="attendance.html" class="nav-item"><i class="fa-solid fa-calendar-check mr-2"></i>Attendance</a>
                <a href="assessment.html" class="nav-item"><i class="fa-solid fa-square-poll-vertical mr-2"></i>Assessments</a>
                <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check mr-2"></i>Tasks</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <!-- Dashboard Summary Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-medium">Total Interns</p>
                        <h3 class="text-2xl font-bold text-white mt-1" id="statTotalInterns">0</h3>
                    </div>
                    <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl"><i class="fa-solid fa-users text-xl"></i></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-medium">Avg Attendance</p>
                        <h3 class="text-2xl font-bold text-white mt-1" id="statAvgAttendance">0%</h3>
                    </div>
                    <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl"><i class="fa-solid fa-user-check text-xl"></i></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-medium">Avg Performance Score</p>
                        <h3 class="text-2xl font-bold text-white mt-1" id="statAvgScore">0 / 100</h3>
                    </div>
                    <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl"><i class="fa-solid fa-star text-xl"></i></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-medium">Active Tasks</p>
                        <h3 class="text-2xl font-bold text-white mt-1" id="statActiveTasks">0</h3>
                    </div>
                    <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl"><i class="fa-solid fa-tasks text-xl"></i></div>
                </div>
            </div>
        </div>

        <!-- Dashboard Recent Overview -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Top Performing Interns -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-5">
                <h2 class="text-md font-semibold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-award text-amber-400"></i> Top Performers</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-300">
                        <thead class="text-xs uppercase bg-slate-900/50 text-slate-400">
                            <tr>
                                <th class="py-2.5 px-3">Intern</th>
                                <th class="py-2.5 px-3">Track</th>
                                <th class="py-2.5 px-3">Score</th>
                            </tr>
                        </thead>
                        <tbody id="topPerformersList" class="divide-y divide-slate-700/50"></tbody>
                    </table>
                </div>
            </div>

            <!-- Task Status Overview -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-5">
                <h2 class="text-md font-semibold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-bar text-indigo-400"></i> System Health</h2>
                <div class="space-y-4" id="systemHealthStats"></div>
            </div>
        </div>
    </main>

    <!-- Application Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
