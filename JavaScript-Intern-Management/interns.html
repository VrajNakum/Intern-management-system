<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Management - InternTrack Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-600 rounded-lg text-white"><i class="fa-solid fa-graduation-cap text-xl"></i></div>
                <h1 class="text-lg font-bold text-white">InternTrack <span class="text-xs text-indigo-400 font-normal">Pro</span></h1>
            </div>
            <nav class="hidden md:flex space-x-1">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-pie mr-2"></i>Dashboard</a>
                <a href="interns.html" class="nav-item active"><i class="fa-solid fa-users mr-2"></i>Interns</a>
                <a href="attendance.html" class="nav-item"><i class="fa-solid fa-calendar-check mr-2"></i>Attendance</a>
                <a href="assessment.html" class="nav-item"><i class="fa-solid fa-square-poll-vertical mr-2"></i>Assessments</a>
                <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check mr-2"></i>Tasks</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <h2 class="text-xl font-bold text-white">Intern Directory</h2>
            <button onclick="openInternModal()" class="btn-primary"><i class="fa-solid fa-plus mr-2"></i>Add New Intern</button>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 flex flex-col md:flex-row gap-4">
            <input type="text" id="searchInput" placeholder="Search by name, email or track..." class="form-input flex-1">
            <select id="trackFilter" class="form-input md:w-48">
                <option value="">All Tracks</option>
                <option value="Frontend">Frontend Development</option>
                <option value="Backend">Backend Development</option>
                <option value="Fullstack">Fullstack</option>
                <option value="UI/UX Design">UI/UX Design</option>
            </select>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-300">
                    <thead class="text-xs uppercase bg-slate-900/50 text-slate-400">
                        <tr>
                            <th class="py-3 px-4">Name</th>
                            <th class="py-3 px-4">Track</th>
                            <th class="py-3 px-4">Mentor</th>
                            <th class="py-3 px-4">Start Date</th>
                            <th class="py-3 px-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="internsTableBody" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/interns.js"></script>
</body>
</html>
