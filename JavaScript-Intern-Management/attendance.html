<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker - InternTrack Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800/90 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold text-white">InternTrack Pro</h1>
            <nav class="hidden md:flex space-x-1">
                <a href="index.html" class="nav-item">Dashboard</a>
                <a href="interns.html" class="nav-item">Interns</a>
                <a href="attendance.html" class="nav-item active">Attendance</a>
                <a href="assessment.html" class="nav-item">Assessments</a>
                <a href="tasks.html" class="nav-item">Tasks</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold">Daily Attendance Logging</h2>
            <input type="date" id="attendanceDate" class="form-input w-auto">
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 p-4">
            <div id="attendanceList" class="space-y-3"></div>
            <button onclick="saveAttendance()" class="btn-primary mt-4 w-full sm:w-auto">Save Daily Log</button>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
